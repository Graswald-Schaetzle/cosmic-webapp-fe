<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>

    <link href="./src/style.css" rel="stylesheet" />

  </head>
  <body>
<!--    <div id="app"></div>-->
    <button id="create-task-button" type="button">Create Task</button>
    <iframe
            src="https://my.matterport.com/show?m=7fLAd3tVW8q&play=1&applicationKey=2m09afwdgxp3g0dgdr8zn193a"
            frameborder="0"
            allow="fullscreen *"
            id="showcase-iframe">
    </iframe>

    <div class="calendar-icon">
      <img src="./calendar.svg" alt="">
    </div>


    <div id="calendar-container">
      <div id="calendar-wrapper">
        <div id="calendar"></div>
      </div>
    </div>


    <div class="tag-control-container">
        <div class="bg"></div>
        <div class="modal">
            <h2>Create Task</h2>
            <input placeholder="Title" class="task-title"/>
            <input placeholder="Description" class="task-description" />
            <input placeholder="Due date" class="task-date"/>
            <input type="text" placeholder="Priority" class="task-priority">
            <button>Create</button>
        </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "MP_SDK": "https://api.matterport.com/sdk/bootstrap/3.0.0-0-g0517b8d76c/sdk.es6.js?applicationKey=2m09afwdgxp3g0dgdr8zn193a"
        }
      }
    </script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar-scheduler@6.1.15/index.global.min.js'></script>
    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/calendar.js"></script>
  </body>
</html>
